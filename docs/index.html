<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gadget de Mesa ESP32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bancada — o simulador do TFT à esquerda (fixo), a ficha do projeto à direita; empilha no celular */
:root{
  --bg:#f5f2fb; --surface:#fffdfc; --line:#ddd3ee; --fg:#1d1430; --muted:#5f5475;
  --accent:#7b3fe4; --accent-soft:#ece2fc; --warn:#c2410c; --warn-soft:#fde7da;
  --pcb:#2a1b5c; --pcb-edge:#1a0f3d;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rainbow:linear-gradient(90deg,#FF3D7F 0 16.6%,#FF8A3D 0 33.3%,#FFE14D 0 50%,#3DFF8A 0 66.6%,#3DC8FF 0 83.3%,#9B5CFF 0);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120d1f; --surface:#1b142c; --line:#33284a; --fg:#ece6f8; --muted:#a59bbd;
  --accent:#b18cff; --accent-soft:#2c1f4d; --warn:#ff9a62; --warn-soft:#3d2216;
  --pcb:#24184e; --pcb-edge:#120a2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120d1f; --surface:#1b142c; --line:#33284a; --fg:#ece6f8; --muted:#a59bbd;
  --accent:#b18cff; --accent-soft:#2c1f4d; --warn:#ff9a62; --warn-soft:#3d2216;
  --pcb:#24184e; --pcb-edge:#120a2b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- simulador ---------- */
.bench{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
@media (max-width:820px){.bench{position:static}}
.board{background:var(--pcb);border:1px solid var(--pcb-edge);border-radius:14px;padding:22px 22px 14px;
  background-image:radial-gradient(circle at 12px 12px,#c9a64a 0 3px,transparent 3.5px),radial-gradient(circle at calc(100% - 12px) 12px,#c9a64a 0 3px,transparent 3.5px),radial-gradient(circle at 12px calc(100% - 12px),#c9a64a 0 3px,transparent 3.5px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#c9a64a 0 3px,transparent 3.5px)}
.screen{display:block;width:100%;max-width:100%;aspect-ratio:1/1;background:#000;border:6px solid #050505;border-radius:4px;}
.rainbow{height:5px;border-radius:3px;background:var(--rainbow);margin-top:12px}
.silk{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#d9ccff;margin-top:10px;letter-spacing:.06em}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.pip{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.err{color:var(--warn)}
video.pipsrc{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- configurações ---------- */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;min-width:0}
.box{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fields input{font:500 15px var(--mono);font-variant-numeric:tabular-nums;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.fields input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
button.go{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.pomo-state{font:500 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Gadget de Mesa ESP32</h1>
    <span class="chip">TFT 240×240</span>
  </header>

  <div class="grid">
    <div class="bench" aria-label="Preview da tela">
      <div class="board">
        <canvas id="tft" class="screen" width="240" height="240" aria-label="Tela TFT simulada"></canvas>
        <div class="rainbow"></div>
        <div class="silk"><span>TFT 240×240</span><span>ESP32-WROOM</span></div>
      </div>
      <p id="pipMsg" class="note">O relógio flutua sobre as outras janelas e continua atualizando.</p>
      <video id="pipVideo" class="pipsrc" muted playsinline></video>
    </div>

    <div class="cfg">
      <section class="box">
        <h2>Telas</h2>
        <div class="seg" role="group" aria-label="Trocar tela">
          <button id="b0" data-s="0" aria-pressed="true">Relógio</button>
          <button id="b1" data-s="1" aria-pressed="false">Bolsa</button>
          <button id="b2" data-s="2" aria-pressed="false">Clima</button>
          <button id="b3" data-s="3" aria-pressed="false">Pomodoro</button>
        </div>
        <div class="row">
          <button id="autoBtn" aria-pressed="true">Trocar tela a cada 30 s</button>
          <button id="waterBtn">Testar "Beba Água!"</button>
        </div>
      </section>

      <section class="box">
        <h2>Pomodoro</h2>
        <p id="pomoState" class="pomo-state">Foco · ciclo 1 de 4 · 25:00</p>
        <div class="row">
          <button id="pomoStart" class="go">Iniciar</button>
          <button id="pomoSkip">Pular etapa</button>
          <button id="pomoReset">Zerar</button>
        </div>
        <div class="fields">
          <label for="cfgFoco">Foco (min)<input id="cfgFoco" type="number" min="1" max="120" value="25"></label>
          <label for="cfgCurta">Pausa curta (min)<input id="cfgCurta" type="number" min="1" max="60" value="5"></label>
          <label for="cfgLonga">Pausa longa (min)<input id="cfgLonga" type="number" min="1" max="90" value="15"></label>
          <label for="cfgCiclos">Ciclos até a longa<input id="cfgCiclos" type="number" min="1" max="8" value="4"></label>
        </div>
        <label class="check" for="cfgSom"><input id="cfgSom" type="checkbox" checked> Bipe quando o tempo acabar</label>
      </section>

      <section class="box">
        <h2>Picture-in-Picture</h2>
        <button id="pipBtn" class="pip">Abrir em Picture-in-Picture</button>
        <div class="seg" role="group" aria-label="Tamanho da janela Picture-in-Picture">
          <button id="sz1" data-sz="200" aria-pressed="false">Pequena</button>
          <button id="sz2" data-sz="300" aria-pressed="true">Média</button>
          <button id="sz3" data-sz="440" aria-pressed="false">Grande</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('tft'), g=cv.getContext('2d');
  // O layout é o do TFT (240×240). A tela se adapta ao tamanho e formato da janela:
  // fundo, faixa e pontinhos ocupam tudo; o conteúdo escala pelo lado menor e fica centralizado.
  let W=240,H=240,k=4,ox=0,oy=0;
  function fit(){
    const cw=cv.clientWidth||240, ch=cv.clientHeight||240, d=Math.max(window.devicePixelRatio||1,2);
    const bw=Math.round(cw*d), bh=Math.round(ch*d);
    if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
    k=Math.min(bw,bh)/240;W=bw/k;H=bh/k;ox=(W-240)/2;oy=(H-240)/2;
  }
  function full(fn){g.save();g.setTransform(k,0,0,k,0,0);fn();g.restore();}
  let screen=0, auto=true, autoTick=Date.now(), forceWaterUntil=0;
  let weather={temp:26,feels:27,hum:58,wind:9,code:2,max:29,min:17,example:true};

  const DIAS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const pad=n=>String(n).padStart(2,'0');

  // hora de Brasília: UTC-3 fixo, igual ao gmtOffset = -10800 do firmware
  function br(){const d=new Date(Date.now()-3*3600e3);return{h:d.getUTCHours(),m:d.getUTCMinutes(),s:d.getUTCSeconds(),ms:d.getUTCMilliseconds(),wd:d.getUTCDay(),D:d.getUTCDate(),M:d.getUTCMonth(),Y:d.getUTCFullYear()};}
  function greet(h){return h>=5&&h<12?'Bom dia!':h>=12&&h<18?'Boa tarde!':'Boa noite!';}

  function text(t,y,size,color,weight){g.font=(weight||600)+' '+size+'px "Chakra Petch", ui-monospace, monospace';g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.fillText(t,120,y);}
  // Paleta "criativa" — todas as cores existem em RGB565 e os degradês viram fillRectVGradient() no TFT_eSPI
  const RAINBOW=['#FF3D7F','#FF8A3D','#FFE14D','#3DFF8A','#3DC8FF','#9B5CFF'];
  function grad(top,bot){full(()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,top);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,W,H);});}
  function rainbow(){full(()=>RAINBOW.forEach((c,i)=>{g.fillStyle=c;g.fillRect(i*W/6,0,W/6+0.5,4);}));}
  function rrect(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();}
  function dots(){full(()=>{const NS=nScreens();for(let i=0;i<NS;i++){g.beginPath();g.arc(W/2+(i-(NS-1)/2)*14,H-12,i===screen?4:3,0,Math.PI*2);g.fillStyle=i===screen?'#FFE14D':'#6B6B9E';g.fill();}});}

  // céu muda com a saudação: manhã = nascer do sol, tarde = pôr do sol, noite = céu estrelado
  function period(h){return h>=5&&h<12?{top:'#FF8A3D',bot:'#7A1FA2',hi:'#FFFFFF',sh:'#C2185B'}:h>=12&&h<18?{top:'#FF3D7F',bot:'#3B1C9E',hi:'#FFE14D',sh:'#5B1FA8'}:{top:'#1B1464',bot:'#0B0B2E',hi:'#7DF9FF',sh:'#9B5CFF'};}
  const STARS=[[18,40],[60,22],[200,30],[222,64],[30,96],[214,140],[16,170],[226,196],[44,214],[190,214]];
  // "Beba Água!": a cada 5 min, dura 7 s, pisca a cada 250 ms
  function waterBlink(t){const now=Date.now();return((t.m%5===0&&t.s<7)||now<forceWaterUntil)&&Math.floor(now/250)%2===0;}
  // nas outras telas: gota d'água no centro do topo (fillTriangle + fillCircle no TFT)
  function drop(){
    g.fillStyle='#00D1FF';
    g.beginPath();g.moveTo(120,13);g.lineTo(113.4,29);g.lineTo(126.6,29);g.closePath();g.fill();
    g.beginPath();g.arc(120,31,7,0,Math.PI*2);g.fill();
    g.fillStyle='#FFFFFF';g.beginPath();g.arc(117,32,2,0,Math.PI*2);g.fill();
  }
  function drawClock(t){
    const P=period(t.h);grad(P.top,P.bot);rainbow();
    if(t.h<5||t.h>=18){g.fillStyle='#FFFFFF';full(()=>STARS.forEach(([x,y])=>g.fillRect(x*W/240,y*H/240,2,2)));}
    text(greet(t.h),28,20,P.hi);
    const nowMs=Date.now();
    // "Beba Água!": a cada 5 min, 7 s, pisca a cada 250 ms
    if(waterBlink(t)){rrect(30,56,180,36,18,'#00D1FF');text('Beba Água!',75,26,'#0B0B2E',700);}
    // HH:MM grande com :SS menor ao lado, alinhados pela base e centralizados juntos
    const hm=pad(t.h)+':'+pad(t.m), ss=':'+pad(t.s), F='"Chakra Petch", ui-monospace, monospace', base=142;
    g.font='700 54px '+F;const wHM=g.measureText(hm).width;
    g.font='700 24px '+F;const wS=g.measureText(ss).width;
    const x0=120-(wHM+3+wS)/2;
    g.textAlign='left';g.textBaseline='alphabetic';
    g.font='700 54px '+F;g.fillStyle=P.sh;g.fillText(hm,x0+3,base+3);g.fillStyle='#FFFFFF';g.fillText(hm,x0,base);
    g.font='700 24px '+F;g.fillStyle=P.sh;g.fillText(ss,x0+wHM+3+2,base+2);g.fillStyle='#FFD1F0';g.fillText(ss,x0+wHM+3,base);
    text(DIAS[t.wd],174,18,'#7DF9FF');
    text(pad(t.D)+' '+MESES[t.M]+' '+t.Y,198,16,'#FFFFFF',500);
  }
  // cabeçalho das outras telas: título à esquerda, hora (HH:MM + :SS menor) à direita
  function header(title,color){
    const t=br(),F='"Chakra Petch", ui-monospace, monospace',hm=pad(t.h)+':'+pad(t.m),ss=':'+pad(t.s),base=30;
    g.textBaseline='alphabetic';
    g.font='600 18px '+F;g.textAlign='left';g.fillStyle=color;g.fillText(title,14,base);
    g.font='700 13px '+F;const wS=g.measureText(ss).width;g.textAlign='right';g.fillStyle='#FFD1F0';g.fillText(ss,228,base);
    g.font='700 20px '+F;g.fillStyle='#FFFFFF';g.fillText(hm,228-wS-1,base);
  }
  // ---------- Tela 2: Bolsa B3 ----------
  let market={ibov:131245,ibovChg:0.84,top:[{t:'PETR4',p:37.42,c:1.12},{t:'VALE3',p:61.85,c:-0.64},{t:'ITUB4',p:36.90,c:0.47}],example:true};
  const brl=(n,d)=>n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
  const pct=n=>(n>=0?'+':'')+brl(n,2)+'%';
  function drawMarket(){
    grad('#123A8C','#0A0F2C');rainbow();
    header('Bolsa B3','#FFE14D');
    text('IBOVESPA',50,13,'#9FC4FF',500);
    text(brl(market.ibov,0)+' pts',76,28,'#FFFFFF',700);
    const up=market.ibovChg>=0;
    rrect(84,92,72,20,10,up?'#3DFF8A':'#FF4D6D');
    text((up?'▲ ':'▼ ')+pct(market.ibovChg).replace('+',''),102,14,'#0A0F2C',700);
    text('MAIS NEGOCIADAS',128,13,'#9FC4FF',500);
    const medal=['#FF8A3D','#FF3D7F','#9B5CFF'];
    market.top.slice(0,3).forEach((a,i)=>{
      const y=152+i*22;
      rrect(10,y-10,220,20,6,'#1E2F70');
      rrect(10,y-10,6,20,3,medal[i]);
      g.font='500 15px "IBM Plex Mono", ui-monospace, monospace';g.textBaseline='middle';
      g.textAlign='left';g.fillStyle='#FFE14D';g.fillText(a.t,22,y);
      g.textAlign='center';g.fillStyle='#FFFFFF';g.fillText(brl(a.p,2),126,y);
      g.textAlign='right';g.fillStyle=a.c>=0?'#3DFF8A':'#FF6B85';g.fillText(pct(a.c),224,y);
    });
  }
  function wDesc(c){if(c===0)return'Céu limpo';if(c<=2)return'Parcial nublado';if(c===3)return'Nublado';if(c<=48)return'Neblina';if(c<=67)return'Chuva';if(c<=77)return'Neve';if(c<=82)return'Pancadas';return'Tempestade';}
  function tempColor(v){return v<18?'#7DF9FF':v<26?'#FFE14D':'#FF8A3D';}
  function drawWeather(){
    grad('#00A8E8','#2D1E8F');rainbow();
    header('Campinas','#FFFFFF');
    g.save();g.translate(3,3);text(Math.round(weather.temp)+'°C',72,52,'#1B1464',700);g.restore();
    text(Math.round(weather.temp)+'°C',72,52,tempColor(weather.temp),700);
    text(wDesc(weather.code),110,18,'#FFFFFF');
    rrect(16,124,208,88,10,'#24187A');
    const rows=[['Sensação',Math.round(weather.feels)+'°C'],['Umidade',Math.round(weather.hum)+'%'],['Vento',Math.round(weather.wind)+' km/h'],['Máx/Mín',Math.round(weather.max)+'/'+Math.round(weather.min)+'°C']];
    g.font='500 15px "IBM Plex Mono", ui-monospace, monospace';g.textBaseline='middle';
    rows.forEach(([k,v],i)=>{const y=138+i*20;g.textAlign='left';g.fillStyle='#9FD8FF';g.fillText(k,28,y);g.textAlign='right';g.fillStyle='#FFFFFF';g.fillText(v,212,y);});
  }
  // ---------- Tela 4: Pomodoro ----------
  // Baseado no timer regressivo da build despertador: inicia/pausa, e no fim pisca vermelho/preto até alguém tocar.
  // o Pomodoro só entra na troca de telas (e nos pontinhos) quando está em uso
  const pomoInUse=()=>pomo.running||pomo.alert||pomo.mode!=='foco'||pomo.cycle!==1||pomo.remaining<dur('foco');
  const nScreens=()=>pomoInUse()||screen===3?4:3;
  const MODES={foco:{nome:'FOCO',top:'#FF5E3A',bot:'#8E1B3A',trk:'#5A1026'},curta:{nome:'PAUSA CURTA',top:'#00B894',bot:'#0B3D5C',trk:'#08303F'},longa:{nome:'PAUSA LONGA',top:'#3DC8FF',bot:'#2D1E8F',trk:'#1F1566'}};
  const cfg={foco:25,curta:5,longa:15,ciclos:4,som:true};
  try{Object.assign(cfg,JSON.parse(localStorage.getItem('pomoCfg')||'{}'));}catch(e){}
  const dur=m=>cfg[m]*60000;
  const pomo={mode:'foco',cycle:1,running:false,endAt:0,remaining:dur('foco'),alert:false};
  const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);};
  const left=()=>pomo.running?pomo.endAt-Date.now():pomo.remaining;
  function advance(){
    if(pomo.mode==='foco')pomo.mode=pomo.cycle%cfg.ciclos===0?'longa':'curta';
    else{pomo.cycle=pomo.mode==='longa'?1:pomo.cycle+1;pomo.mode='foco';}
    pomo.running=false;pomo.remaining=dur(pomo.mode);
  }
  let actx=null;
  function beep(){
    if(!cfg.som)return;
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      [0,0.35,0.7].forEach(t0=>{const o=actx.createOscillator(),v=actx.createGain();o.frequency.value=880;o.connect(v);v.connect(actx.destination);
        const t=actx.currentTime+t0;v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(0.3,t+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.start(t);o.stop(t+0.3);});
    }catch(e){}
  }
  function pomoTick(){
    if(pomo.running&&Date.now()>=pomo.endAt){pomo.running=false;pomo.remaining=0;pomo.alert=true;beep();setScreen(3);}
    pomoUI();
  }
  function ack(){
    if(!pomo.alert)return false;
    pomo.alert=false;advance();autoTick=Date.now();
    // ao confirmar o fim (tocando na tela, inclusive no PiP), a próxima etapa já começa a contar
    pomo.endAt=Date.now()+pomo.remaining;pomo.running=true;
    pomoUI();return true;
  }
  function drawPomo(){
    const M=MODES[pomo.mode];
    if(pomo.alert){
      const on=Math.floor(Date.now()/500)%2===0;
      full(()=>{g.fillStyle=on?'#FF1E1E':'#000000';g.fillRect(0,0,W,H);});
      text('TEMPO!',92,48,on?'#FFFFFF':'#FF1E1E',700);
      text(pomo.mode==='foco'?'Foco concluído':'Pausa concluída',136,18,'#FFFFFF');
      text('toque para continuar',164,14,on?'#FFE14D':'#FFFFFF',500);
      return;
    }
    grad(M.top,M.bot);rainbow();
    header('Pomodoro','#FFFFFF');
    g.font='700 13px "Chakra Petch", ui-monospace, monospace';const pw=g.measureText(M.nome).width+24;
    rrect(120-pw/2,48,pw,22,11,'#FFFFFF');text(M.nome,59,13,M.bot,700);
    const L=left();
    g.save();g.translate(3,3);text(fmt(L),112,56,M.trk,700);g.restore();
    text(fmt(L),112,56,'#FFFFFF',700);
    const frac=Math.min(1,Math.max(0,1-L/dur(pomo.mode)));
    rrect(30,146,180,10,5,M.trk);if(frac>0)rrect(30,146,Math.max(10,180*frac),10,5,'#FFE14D');
    text(pomo.running?'em andamento':(L===dur(pomo.mode)?'pronto para iniciar':'pausado'),172,14,'#FFFFFF',500);
    const n=cfg.ciclos,done=pomo.mode==='foco'?pomo.cycle-1:pomo.cycle,x0=120-(n-1)*9;
    for(let i=0;i<n;i++){g.beginPath();g.arc(x0+i*18,196,5,0,Math.PI*2);if(i<done){g.fillStyle='#FFE14D';g.fill();}else{g.strokeStyle='#FFE14D';g.lineWidth=1.5;g.stroke();}}
  }
  const $=id=>document.getElementById(id);
  function pomoUI(){
    const st=$('pomoStart');if(!st)return;
    st.textContent=pomo.alert?'OK, continuar':pomo.running?'Pausar':(left()<dur(pomo.mode)?'Continuar':'Iniciar');
    const nome={foco:'Foco',curta:'Pausa curta',longa:'Pausa longa'}[pomo.mode];
    $('pomoState').textContent=pomo.alert?'Tempo esgotado. Toque na tela ou em OK.':nome+' · ciclo '+pomo.cycle+' de '+cfg.ciclos+' · '+fmt(left());
  }
  $('pomoStart').addEventListener('click',()=>{
    if(ack())return;
    if(pomo.running){pomo.remaining=pomo.endAt-Date.now();pomo.running=false;}
    else{pomo.endAt=Date.now()+pomo.remaining;pomo.running=true;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}}
    setScreen(3);
  });
  $('pomoSkip').addEventListener('click',()=>{if(!ack())advance();pomoUI();});
  $('pomoReset').addEventListener('click',()=>{Object.assign(pomo,{mode:'foco',cycle:1,running:false,alert:false,remaining:dur('foco')});pomoUI();});
  [['cfgFoco','foco'],['cfgCurta','curta'],['cfgLonga','longa'],['cfgCiclos','ciclos']].forEach(([id,key])=>{
    const el=$(id);el.value=cfg[key];
    el.addEventListener('change',()=>{
      const v=Math.round(+el.value);if(!(v>=+el.min&&v<=+el.max)){el.value=cfg[key];return;}
      const fresh=!pomo.running&&pomo.remaining===dur(pomo.mode);
      cfg[key]=v;if(fresh&&key===pomo.mode)pomo.remaining=dur(pomo.mode);
      if(pomo.cycle>cfg.ciclos)pomo.cycle=1;
      try{localStorage.setItem('pomoCfg',JSON.stringify(cfg));}catch(e){}
      pomoUI();
    });
  });
  $('cfgSom').checked=cfg.som;
  $('cfgSom').addEventListener('change',e=>{cfg.som=e.target.checked;try{localStorage.setItem('pomoCfg',JSON.stringify(cfg));}catch(err){}});
  cv.addEventListener('click',ack);
  // qualquer botão da página também desliga o alerta, como na build despertador
  document.addEventListener('click',e=>{if(pomo.alert&&e.target.closest('button')&&e.target.id!=='pomoStart'&&e.target.id!=='pomoSkip')ack();},true);

  function draw(){
    const t=br();
    fit();g.setTransform(k,0,0,k,ox*k,oy*k);
    pomoTick();
    if(auto&&!pomo.alert&&Date.now()-autoTick>=30000){autoTick=Date.now();setScreen((screen+1)%(pomoInUse()?4:3));}
    if(screen===0)drawClock(t);else if(screen===1)drawMarket();else if(screen===2)drawWeather();else drawPomo();
    if(screen!==0&&waterBlink(t))drop();
    dots();
  }
  function setScreen(i){screen=i;autoTick=Date.now();[0,1,2,3].forEach(k=>document.getElementById('b'+k).setAttribute('aria-pressed',String(k===i)));draw();}
  document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>setScreen(+b.dataset.s)));
  document.getElementById('waterBtn').addEventListener('click',()=>{forceWaterUntil=Date.now()+7000;autoTick=Date.now();});
  const autoBtn=document.getElementById('autoBtn');
  autoBtn.addEventListener('click',()=>{auto=!auto;autoTick=Date.now();autoBtn.setAttribute('aria-pressed',String(auto));});

  setInterval(draw,50);draw();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);

  // clima ao vivo (funciona fora do sandbox; senão fica o exemplo)
  async function loadWeather(){
    try{
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.9056&longitude=-47.0608&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=1');
      const j=await r.json(),c=j.current;
      weather={temp:c.temperature_2m,feels:c.apparent_temperature,hum:c.relative_humidity_2m,wind:c.wind_speed_10m,code:c.weather_code,max:j.daily.temperature_2m_max[0],min:j.daily.temperature_2m_min[0],example:false};
    }catch(e){}
  }
  loadWeather();setInterval(loadWeather,10*60*1000);

  // bolsa ao vivo pela brapi.dev (sem chave para a lista; se falhar, fica o exemplo)
  async function loadMarket(){
    try{
      const r=await fetch('https://brapi.dev/api/quote/list?type=stock&sortBy=volume&sortOrder=desc&limit=3');
      const j=await r.json();
      const top=(j.stocks||[]).slice(0,3).map(a=>({t:a.stock,p:a.close,c:a.change}));
      if(top.length===3)market.top=top,market.example=false;
      try{
        const r2=await fetch('https://brapi.dev/api/quote/%5EBVSP');
        const q=(await r2.json()).results[0];
        if(q&&q.regularMarketPrice)market.ibov=q.regularMarketPrice,market.ibovChg=q.regularMarketChangePercent;
        else market.example=true;
      }catch(e){market.example=true;}
    }catch(e){}
  }
  loadMarket();setInterval(loadMarket,10*60*1000);

  // ---------- Picture-in-Picture ----------
  const pipBtn=document.getElementById('pipBtn'), msg=document.getElementById('pipMsg'), vid=document.getElementById('pipVideo');
  function say(t,err){msg.textContent=t;msg.classList.toggle('err',!!err);}

  // 1) Document PiP (Chrome/Edge): move o próprio canvas para a janela flutuante
  let pipWin=null, pipSize=300;
  try{const v=+localStorage.getItem('pipSize');if(v>=160&&v<=900)pipSize=v;}catch(e){}
  const szBtns=[...document.querySelectorAll('[data-sz]')];
  function markSize(){let best=szBtns[0];szBtns.forEach(b=>{if(Math.abs(b.dataset.sz-pipSize)<Math.abs(best.dataset.sz-pipSize))best=b;});szBtns.forEach(b=>b.setAttribute('aria-pressed',String(b===best)));}
  function saveSize(){try{localStorage.setItem('pipSize',String(pipSize));}catch(e){}markSize();}
  // janela quadrada; o navegador só deixa redimensionar a partir de um clique
  function resizePip(delta,abs){
    if(!pipWin){
      if(abs){pipSize=abs;saveSize();}
      if(document.pictureInPictureElement)say('Neste modo (Picture-in-Picture de vídeo) quem manda no tamanho é o navegador, e ele tem um tamanho mínimo. Para diminuir mais, abra a página fora do Claude no Chrome ou Edge.',true);
      return;
    }
    const cur=Math.min(pipWin.innerWidth,pipWin.innerHeight);
    const n=Math.max(160,Math.min(900,abs||cur+delta));
    try{pipWin.resizeBy(n-pipWin.innerWidth,n-pipWin.innerHeight);}catch(e){}
    pipSize=n;saveSize();
  }
  szBtns.forEach(b=>b.addEventListener('click',async()=>{
    const v=+b.dataset.sz;
    if(pipWin){pipSize=v;saveSize();try{await docPip();}catch(e){resizePip(0,v);}return;}
    resizePip(0,v);
  }));
  markSize();
  async function docPip(){
    const pw=await window.documentPictureInPicture.requestWindow({width:pipSize,height:pipSize});
    pipWin=pw;
    pw.addEventListener('resize',()=>{if(pipWin!==pw)return;pipSize=Math.round(Math.min(pw.innerWidth,pw.innerHeight));saveSize();});
    const st=pw.document.createElement('style');
    st.textContent='html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}'+
      '.z{position:fixed;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s}body:hover .z{opacity:1}'+
      '.z button{width:30px;height:30px;border-radius:15px;border:0;background:rgba(20,10,45,.75);color:#fff;font:700 18px system-ui;cursor:pointer}'+
      '.z button:hover{background:#7b3fe4}';
    pw.document.head.append(st);
    document.querySelectorAll('link[rel=stylesheet]').forEach(l=>pw.document.head.append(l.cloneNode()));
    const z=pw.document.createElement('div');z.className='z';
    [['−',-60,'Diminuir'],['+',60,'Aumentar']].forEach(([l,d,t])=>{const b=pw.document.createElement('button');b.textContent=l;b.title=t;b.onclick=()=>resizePip(d);z.append(b);});
    const holder=cv.parentNode, next=cv.nextSibling;
    cv.style.cssText='width:100vw;height:100vh;border:0;border-radius:0';
    pw.document.body.append(cv,z);
    say('Relógio em Picture-in-Picture. Mude o tamanho arrastando a borda da janelinha, pelos botões − e + que aparecem nela ou pelos botões abaixo.');
    pw.addEventListener('pagehide',()=>{if(pipWin!==pw)return;pipWin=null;cv.style.cssText='';holder.insertBefore(cv,next);say('O relógio flutua sobre as outras janelas e continua atualizando.');});
  }
  // 2) Video PiP (Safari, Firefox, Chrome): transmite o canvas para um <video>
  async function videoPip(){
    if(!vid.srcObject)vid.srcObject=cv.captureStream(20);
    await vid.play();
    await vid.requestPictureInPicture();
    say('Relógio em Picture-in-Picture de vídeo. Aqui o tamanho é controlado pelo navegador: arraste o canto da janelinha, mas ela não fica menor que o mínimo dele. Para diminuir à vontade, abra a página fora do Claude no Chrome ou Edge.');
    vid.addEventListener('leavepictureinpicture',()=>say('O relógio flutua sobre as outras janelas e continua atualizando.'),{once:true});
  }
  pipBtn.addEventListener('click',async()=>{
    if(document.pictureInPictureElement){document.exitPictureInPicture();return;}
    const errs=[];
    if('documentPictureInPicture' in window){try{await docPip();return;}catch(e){errs.push(e);}}
    if(document.pictureInPictureEnabled&&cv.captureStream){try{await videoPip();return;}catch(e){errs.push(e);}}
    say('Este navegador ou esta visualização bloqueou o Picture-in-Picture. Abra a versão do GitHub Pages (docs/index.html) no Chrome, Edge ou Safari.',true);
  });
})();
</script>
